name: Daily lots

on:
  schedule:
    # 09:00 Europe/Moscow (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-lots
  cancel-in-progress: false

# По умолчанию ubuntu (GitHub). torgi.gov.ru с зарубежных IP часто недоступен.
# Варианты:
# 1) Settings → Secrets → HTTPS_PROXY = рабочий HTTP(S) прокси с доступом в РФ
# 2) Settings → Variables → ACTIONS_RUNNER = self-hosted  (+ runner на Mac)
jobs:
  update:
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch lots
        env:
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
          NODE_USE_ENV_PROXY: '1'
        run: pnpm fetch-lots

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAP_URL: ${{ secrets.MAP_URL }}
        run: pnpm notify

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/lots.json data/last-run.json data/previous-ids.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update SPb lots $(date -u +%Y-%m-%d)"
            git push
          fi
